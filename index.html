<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #222222;
    --muted: #666666;
    --line: #dddddd;
    --accent: #1a4f8b;
    --title: #1f5c99;
    --active-bg: #eaf1f9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 "Inter", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header { padding: 48px 0 24px; }
  .hero { display: flex; gap: 24px; align-items: center; }
  .hero img { width: 110px; height: 110px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  h1 { color: var(--title); font-size: 2rem; font-weight: 700; margin: 0 0 2px; line-height: 1.2; }
  .role { color: var(--muted); margin: 0; }
  .thesis { margin: 18px 0 0; }
  .about { margin: 12px 0 0; }
  .links { margin-top: 12px; font-size: .95rem; }
  .links a + a::before { content: "|"; color: var(--line); margin: 0 10px; display: inline-block; }

  /* Layout: menu column on the left */
  header { border-bottom: 1px solid var(--line); }
  .layout { display: grid; grid-template-columns: 190px 1fr; gap: 48px; align-items: start; }
  aside { position: sticky; top: 0; padding-top: 32px; }
  .navlinks { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .navlinks a { font-size: .95rem; color: var(--text); padding: 4px 0 4px 10px; border-left: 2px solid transparent; }
  .navlinks a:hover { color: var(--title); text-decoration: none; }
  .navlinks a.active { color: var(--title); font-weight: 600; background: var(--active-bg); border-left-color: var(--title); }
  .navlinks a { transition: background .15s, color .15s; }
  #search { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--text); font: inherit; font-size: .88rem; }
  #search:focus { outline: none; border-color: var(--accent); }

  /* Sections */
  section { padding: 32px 0 0; }
  h2 { color: var(--title); font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .intro { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .year { font-weight: 700; font-size: .95rem; margin: 18px 0 6px; }
  .item { margin: 0 0 14px; }
  .item .t { font-weight: 600; line-height: 1.4; }
  .item .m { font-size: .92rem; color: var(--muted); }
  .item .m b { color: var(--text); font-weight: 600; }
  .item .acts { display: flex; flex-wrap: wrap; gap: 14px; font-size: .88rem; }
  .badge { font-size: .85rem; font-weight: 400; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .badge::before { content: "["; }
  .badge::after { content: "]"; }

  /* Teaching table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 700; border-bottom: 2px solid var(--text); }
  td.h, th.h { text-align: right; white-space: nowrap; }
  tfoot td { font-weight: 700; border-bottom: none; }
  .empty { color: var(--muted); padding: 30px 0; }

  footer { margin-top: 48px; padding: 18px 0 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }

  @media (max-width: 760px) {
    header { padding-top: 32px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 14px; }
    .hero img { width: 90px; height: 90px; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    aside { position: static; padding-top: 20px; }
    .navlinks { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
    .navlinks a { padding: 2px 0; border-left: none; }
  }
</style>
</head>
<body>

<header><div class="wrap" id="hero"></div></header>
<div class="wrap layout">
  <aside>
    <input id="search" type="search" placeholder="Search…" aria-label="Search activities">
    <nav class="navlinks" id="navlinks"></nav>
  </aside>
  <main id="main"></main>
</div>
<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script>
(function () {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : "";
  const joinMeta = parts => parts.filter(Boolean).join(" · ");
  const boldMe = authors => {
    const a = esc(authors);
    const me = PROFILE.authorName && esc(PROFILE.authorName);
    return me ? a.split(me).join(`<b>${me}</b>`) : a;
  };
  const acts = list => {
    const html = list.filter(([u]) => u).map(([u, t]) => link(u, t)).join("");
    return html ? `<div class="acts">${html}</div>` : "";
  };
  const yearOf = it => parseInt(String(it.year).slice(-4), 10) || 0;

  const SECTIONS = [
    { key: "publications", label: "Publications", stat: "Publications",
      intro: "Peer-reviewed journal articles and conference papers.",
      item: it => `<div class="t">${esc(it.title)}</div>
        <div class="m">${boldMe(it.authors)}</div>
        <div class="m"><i>${esc(it.venue)}</i></div>
        ${acts([[it.doi, "DOI ↗"], [it.pdf, "PDF ↗"], [it.code, "Code ↗"]])}` },
    { key: "preprints", label: "Preprints", stat: "Preprints",
      intro: "Papers shared online before or during peer review.",
      item: it => `<div class="t">${esc(it.title)}${it.status ? `<span class="badge warm">${esc(it.status)}</span>` : ""}</div>
        <div class="m">${boldMe(it.authors)}</div>
        ${it.venue ? `<div class="m"><i>${esc(it.venue)}</i></div>` : ""}
        ${acts([[it.link, "Read ↗"]])}` },
    { key: "reports", label: "Reports", stat: "Research reports",
      intro: "Technical and research reports.",
      item: it => `<div class="t">${esc(it.title)}</div>
        <div class="m">${joinMeta([it.authors ? boldMe(it.authors) : "", esc(it.institution)])}</div>
        ${acts([[it.link, "Read ↗"]])}` },
    { key: "internships", label: "Internships", stat: "Internship reports",
      intro: "Internship reports written before and during my PhD.",
      item: it => `<div class="t">${esc(it.title)}</div>
        <div class="m">${joinMeta([esc(it.institution), it.supervisor ? "Supervised by " + esc(it.supervisor) : "", esc(it.duration)])}</div>
        ${acts([[it.link, "Read ↗"]])}` },
    { key: "teaching", label: "Teaching", stat: "Teaching hours", table: true,
      intro: "Classes I taught at university." },
    { key: "supervision", label: "Supervision",
      intro: "Student internships I supervised.",
      item: it => {
        const LV = { L1: "1st-year Bachelor's", L2: "2nd-year Bachelor's", L3: "3rd-year Bachelor's", M1: "1st-year Master's", M2: "2nd-year Master's", ENGINEERING: "Final-year engineering" };
        const lvl = LV[String(it.level).toUpperCase()] || it.level;
        const title = it.topic || `${lvl} internship`;
        return `<div class="t">${esc(title)}${it.level ? `<span class="badge">${esc(it.level)}</span>` : ""}</div>
        <div class="m">${joinMeta([it.topic ? esc(lvl) + " internship" : "", it.student ? "Student: " + esc(it.student) : "", it.coSupervisors ? "Co-supervised with " + esc(it.coSupervisors) : "", esc(it.duration), esc(it.institution)])}</div>`; } },
    { key: "conferences", label: "Conferences", stat: "Conference talks & posters",
      intro: "Talks and posters at scientific conferences and workshops.",
      item: it => {
        const cls = /poster/i.test(it.type) ? "green" : "";
        return `<div class="t">${esc(it.title)}${it.type ? `<span class="badge ${cls}">${esc(it.type)}</span>` : ""}</div>
        ${it.authors ? `<div class="m">${boldMe(it.authors)}</div>` : ""}
        <div class="m">${joinMeta([`<i>${esc(it.event)}</i>`, esc(it.location), esc(it.date)])}</div>
        ${acts([[it.link, "Abstract ↗"]])}`; } },
    { key: "fieldwork", label: "Fieldwork",
      intro: "Field missions at sea and on the coast to collect acoustic data.",
      item: it => `<div class="t">${esc(it.title)}</div>
        ${joinMeta([esc(it.location), esc(it.dates)]) ? `<div class="m">${joinMeta([esc(it.location), esc(it.dates)])}</div>` : ""}
        ${it.description ? `<div class="m">${esc(it.description)}</div>` : ""}
        ${it.partners ? `<div class="m">Partners: ${esc(it.partners)}</div>` : ""}
        ${acts([[it.link, "More ↗"]])}` },
    { key: "outreach", label: "Outreach", stat: "Outreach talks",
      intro: "Talks and events to share science with the general public.",
      item: it => `<div class="t">${esc(it.title)}</div>
        <div class="m">${joinMeta([`<b>${esc(it.event)}</b>`, esc(it.audience), esc(it.location), esc(it.date)])}</div>
        ${acts([[it.link, "More ↗"]])}` },
    { key: "summerSchools", label: "Summer Schools", stat: "Summer schools",
      intro: "Summer schools I organized or attended.",
      item: it => {
        const cls = /organi/i.test(it.role) ? "warm" : "";
        return `<div class="t">${esc(it.name)}${it.role ? `<span class="badge ${cls}">${esc(it.role)}</span>` : ""}</div>
        <div class="m">${joinMeta([esc(it.location), esc(it.dates)])}</div>
        ${it.details ? `<div class="m">${esc(it.details)}</div>` : ""}
        ${acts([[it.link, "Website ↗"]])}`; } }
  ];

  const getList = key => (ACTIVITIES[key] || []).slice().sort((a, b) => yearOf(b) - yearOf(a));
  const totalHours = list => list.reduce((s, it) => s + (Number(it.hours) || 0), 0);

  // ----- Hero -----
  const P = PROFILE, L = P.links || {};
  const linkItems = [
    [L.email && "mailto:" + L.email, "Email"], [L.orcid, "ORCID"], [L.scholar, "Google Scholar"],
    [L.hal, "HAL"], [L.github, "GitHub"], [L.linkedin, "LinkedIn"], [L.cv, "CV (PDF)"]
  ].filter(([u]) => u);

  document.getElementById("hero").innerHTML = `
    <div class="hero">
      ${P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.name)}">` : ""}
      <div>
        <h1>${esc(P.name)}</h1>
        <p class="role">${joinMeta([esc(P.role), esc(P.lab), esc(P.university)])}</p>
      </div>
    </div>
    ${P.thesisTitle ? `<p class="thesis"><b>PhD thesis</b>${P.period ? ` (${esc(P.period)})` : ""}: <i>${esc(P.thesisTitle)}</i>
      ${P.supervisors ? `<br>Advisors: ${esc(P.supervisors)}` : ""}</p>` : ""}
    ${P.about ? `<p class="about">${esc(P.about)}</p>` : ""}
    ${linkItems.length ? `<div class="links">${linkItems.map(([u, t]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join("")}</div>` : ""}`;
  document.title = `${P.name} · PhD Portfolio`;

  document.getElementById("navlinks").innerHTML =
    SECTIONS.filter(s => (ACTIVITIES[s.key] || []).length).map(s => `<a href="#${s.key}">${s.label}</a>`).join("");

  document.getElementById("foot").innerHTML =
    `© ${new Date().getFullYear()} ${esc(P.name)} · Last updated ${new Date(document.lastModified).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}`;

  // ----- Sections -----
  function render(query) {
    const q = (query || "").trim().toLowerCase();
    const match = it => !q || Object.values(it).join(" ").toLowerCase().includes(q);
    let html = "", shown = 0;

    for (const s of SECTIONS) {
      const list = getList(s.key).filter(match);
      if (!list.length) continue;
      shown++;
      let body;
      if (s.table) {
        body = `<div class="table-wrap"><table>
          <thead><tr><th>Year</th><th>Course</th><th>Level</th><th>Type</th><th class="h">Hours</th></tr></thead>
          <tbody>${list.map(it => `<tr>
            <td>${esc(it.year)}</td>
            <td><b>${esc(it.course)}</b><br><span style="color:var(--muted);font-size:.82rem">${esc(it.institution)}</span></td>
            <td>${esc(it.level)}</td><td>${esc(it.type)}</td><td class="h">${esc(it.hours)} h</td></tr>`).join("")}</tbody>
          <tfoot><tr><td colspan="4">Total</td><td class="h">${totalHours(list)} h</td></tr></tfoot>
        </table></div>`;
      } else {
        let lastYear = null;
        const anyYear = list.some(it => yearOf(it));
        body = list.map(it => {
          const y = yearOf(it);
          const head = anyYear && y !== lastYear ? (y ? `<div class="year">${y}</div>` : `<div class="year"></div>`) : "";
          lastYear = y;
          return head + `<div class="item">${s.item(it)}</div>`;
        }).join("");
      }
      html += `<section id="${s.key}">
        <h2>${s.label}</h2>
        <p class="intro">${s.intro}</p>${body}</section>`;
    }
    document.getElementById("main").innerHTML =
      shown ? html : `<p class="empty">No results for “${esc(query)}”.</p>`;
  }

  // Highlight the menu item of the section currently on screen
  function updateActive() {
    const secs = [...document.querySelectorAll("main section")];
    let current = secs.length ? secs[0].id : null;
    for (const sec of secs) if (sec.getBoundingClientRect().top <= 120) current = sec.id;
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2 && secs.length) current = secs[secs.length - 1].id;
    document.querySelectorAll(".navlinks a").forEach(a =>
      a.classList.toggle("active", a.getAttribute("href") === "#" + current));
  }
  window.addEventListener("scroll", updateActive, { passive: true });
  window.addEventListener("resize", updateActive);

  render("");
  updateActive();
  document.getElementById("search").addEventListener("input", e => { render(e.target.value); updateActive(); });
})();
</script>
</body>
</html>
